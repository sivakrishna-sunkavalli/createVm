name: Oracle Always Free VM Provisioner

on:
  schedule:
    # Runs the workflow container every 5 minutes (GitHub's fastest limit)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Forces the workflow to show up in the Actions tab for manual runs

jobs:
  launch-instance:
    runs-on: ubuntu-latest

    steps:
    - name: Set up OCI CLI via Pip
      run: |
        mkdir -p ~/.oci
        echo "${{ secrets.OCI_KEY_FILE }}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/oci_api_key.pem
        
        cat << 'EOF' > ~/.oci/config
        [DEFAULT]
        user=${{ secrets.OCI_USER_ID }}
        fingerprint=${{ secrets.OCI_FINGERPRINT }}
        tenancy=${{ secrets.OCI_TENANCY_ID }}
        region=us-chicago-1
        key_file=~/.oci/oci_api_key.pem
        EOF
        
        chmod 600 ~/.oci/config
        pip install oci-cli

    - name: Discover Domains & Attempt VM Creation
      env:
        COMPARTMENT: ${{ vars.OCI_COMPARTMENT_ID }}
        SUBNET: ${{ vars.OCI_SUBNET_ID }}
        IMAGE: ${{ vars.OCI_IMAGE_ID }}
        SSH_KEY: ${{ vars.SSH_PUBLIC_KEY }}
        SUPPRESS_LABEL_WARNING: "True"
        OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
      run: |
        echo "Creating SSH key file..."
        echo "$SSH_KEY" > instance_key.pub
        
        for i in {1..2}; do
          echo "=== Check Cycle $i ==="

          echo "Checking if an Ampere VM already exists..."
          EXISTING_VMS=$(oci compute instance list --compartment-id "$COMPARTMENT" --query "data[?shape=='VM.Standard.A1.Flex' && 'lifecycle-state'!='TERMINATED'].id" --output json)
          if [ "$EXISTING_VMS" != "[]" ] && [ ! -z "$EXISTING_VMS" ]; then
            echo "SUCCESS: An Always Free Ampere VM already exists. Terminating workflow."
            exit 0
          fi

          echo "Fetching all Availability Domains for the region..."
          # Fix: Pulls names strictly via raw JSON instead of table lines to eliminate character parsing leaks
          AD_JSON=$(oci iam availability-domain list --compartment-id "$COMPARTMENT" --query "data[].name" --output json)
          
          if [ -z "$AD_JSON" ] || [ "$AD_JSON" = "[]" ]; then
            echo "ERROR: Could not fetch availability domains. Check OCI credentials."
            exit 1
          fi

          SUCCESS=false

          # Safe loop mapping directly across the structured JSON keys
          for AD in $(echo "$AD_JSON" | jq -r '.[]'); do
            echo "Attempting VM creation in Domain: $AD"

            # Launching with direct native payload quoting format
            oci compute instance launch \
              --availability-domain "$AD" \
              --compartment-id "$COMPARTMENT" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":1,"memoryInGBs":2}' \
              --subnet-id "$SUBNET" \
              --image-id "$IMAGE" \
              --assign-public-ip true \
              --display-name "AlwaysFree-ARM-Server" \
              --ssh-authorized-keys-file instance_key.pub \
              --wait-for-state RUNNING

            if [ $? -eq 0 ]; then
              echo "SUCCESS: Instance successfully created in $AD!"
              SUCCESS=true
              break 2 
            else
              echo "Capacity error or request rejected in $AD."
            fi
          done
          
          echo "Waiting 30 seconds before next scan..."
          sleep 30
        done

        if [ "$SUCCESS" = false ]; then
          echo "All availability domains are currently out of stock for this run window."
          exit 1
        fi
