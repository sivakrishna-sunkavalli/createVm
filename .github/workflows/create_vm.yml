name: Oracle Always Free A1 Provisioner

on:
  schedule:
    # GitHub's minimum scheduled interval.
    # The actual OCI checks happen every 60 seconds inside the job.
    - cron: '*/5 * * * *'

  workflow_dispatch:

concurrency:
  group: oracle-a1-provisioner
  cancel-in-progress: false

jobs:
  launch-instance:
    runs-on: ubuntu-latest

    # Keep the runner alive and checking.
    timeout-minutes: 350

    steps:

      # ============================================================
      # INSTALL OCI CLI
      # ============================================================

      - name: Install and configure OCI CLI
        shell: bash
        run: |
          set -u

          echo "======================================================"
          echo "Installing OCI CLI"
          echo "======================================================"

          mkdir -p ~/.oci

          echo "Writing OCI private key..."

          printf '%s\n' '${{ secrets.OCI_KEY_FILE }}' \
            > ~/.oci/oci_api_key.pem

          chmod 600 ~/.oci/oci_api_key.pem

          echo "Writing OCI configuration..."

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_ID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_ID }}
          region=us-chicago-1
          key_file=~/.oci/oci_api_key.pem
          EOF

          chmod 600 ~/.oci/config

          echo "Installing OCI CLI..."

          python -m pip install --upgrade pip
          pip install oci-cli

          echo ""
          echo "OCI CLI version:"
          oci --version

          echo ""
          echo "Testing OCI authentication..."

          if oci iam region list --output json >/dev/null 2>&1; then
            echo "OCI authentication test passed."
          else
            echo "WARNING: OCI authentication test failed."
            echo "The provisioner will continue and retry."
          fi


      # ============================================================
      # PROVISIONER
      # ============================================================

      - name: Check OCI capacity every minute
        shell: bash

        env:
          COMPARTMENT: ${{ vars.OCI_COMPARTMENT_ID }}
          SUBNET: ${{ vars.OCI_SUBNET_ID }}
          IMAGE: ${{ vars.OCI_IMAGE_ID }}
          SSH_KEY: ${{ vars.SSH_PUBLIC_KEY }}

          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

        run: |
          # IMPORTANT:
          #
          # Do NOT use "set -e".
          #
          # OCI capacity errors are expected while searching for
          # an Always Free A1 instance.
          #
          # Every OCI command is handled explicitly.

          set -u

          CHECK_INTERVAL=60

          echo ""
          echo "======================================================"
          echo "Oracle Always Free A1 Provisioner"
          echo "======================================================"
          echo "Check interval: ${CHECK_INTERVAL} seconds"
          echo "Region: us-chicago-1"
          echo "======================================================"


          # ==========================================================
          # BASIC CONFIGURATION CHECK
          # ==========================================================

          echo ""
          echo "Checking required configuration..."

          if [ -z "${COMPARTMENT:-}" ]; then
            echo "ERROR: OCI_COMPARTMENT_ID is empty."
            exit 1
          fi

          if [ -z "${SUBNET:-}" ]; then
            echo "ERROR: OCI_SUBNET_ID is empty."
            exit 1
          fi

          if [ -z "${IMAGE:-}" ]; then
            echo "ERROR: OCI_IMAGE_ID is empty."
            exit 1
          fi

          if [ -z "${SSH_KEY:-}" ]; then
            echo "ERROR: SSH_PUBLIC_KEY is empty."
            exit 1
          fi

          echo "Required configuration is present."


          # ==========================================================
          # SSH KEY
          # ==========================================================

          echo ""
          echo "Creating SSH public key file..."

          printf '%s\n' "$SSH_KEY" > instance_key.pub

          chmod 600 instance_key.pub

          echo "SSH public key created."


          # ==========================================================
          # TELEGRAM
          # ==========================================================

          send_telegram() {

            local MESSAGE="$1"

            if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
              echo "Telegram credentials not configured."
              return 0
            fi

            echo "Sending Telegram notification..."

            curl \
              --silent \
              --show-error \
              --fail \
              --max-time 15 \
              -X POST \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${MESSAGE}"

            local CURL_STATUS=$?

            if [ $CURL_STATUS -ne 0 ]; then
              echo "WARNING: Telegram notification failed."
            else
              echo "Telegram notification sent."
            fi

            return 0
          }


          # ==========================================================
          # CHECK EXISTING A1 INSTANCE
          # ==========================================================

          check_existing_instance() {

            echo ""
            echo "Checking for existing Ampere A1 instances..."

            # Use a temporary file so that stderr doesn't get mixed
            # into the JSON variable.

            TEMP_OUTPUT=$(mktemp)

            oci compute instance list \
              --compartment-id "$COMPARTMENT" \
              --all \
              --query "data[?shape=='VM.Standard.A1.Flex' && 'lifecycle-state'!='TERMINATED'].id" \
              --output json \
              > "$TEMP_OUTPUT" 2>&1

            OCI_STATUS=$?

            if [ $OCI_STATUS -ne 0 ]; then

              echo ""
              echo "WARNING: OCI instance query failed."
              echo "OCI exit code: $OCI_STATUS"
              echo "OCI response:"

              cat "$TEMP_OUTPUT"

              rm -f "$TEMP_OUTPUT"

              # 2 = API/query failure.
              return 2
            fi

            EXISTING_VMS=$(cat "$TEMP_OUTPUT")

            rm -f "$TEMP_OUTPUT"

            echo "Existing A1 instances: ${EXISTING_VMS:-<none>}"

            # Make sure the response is valid JSON.

            if ! echo "$EXISTING_VMS" | jq empty >/dev/null 2>&1; then

              echo "WARNING: OCI returned invalid JSON."
              echo "Response:"
              echo "$EXISTING_VMS"

              return 2
            fi

            # Check whether the returned array contains anything.

            INSTANCE_COUNT=$(echo "$EXISTING_VMS" | jq 'length' 2>/dev/null)

            if [ -z "$INSTANCE_COUNT" ]; then
              echo "WARNING: Could not parse instance count."
              return 2
            fi

            if [ "$INSTANCE_COUNT" -gt 0 ]; then
              echo "An A1 instance already exists."
              return 0
            fi

            echo "No A1 instance currently exists."

            return 1
          }


          # ==========================================================
          # GET AVAILABILITY DOMAINS
          # ==========================================================

          get_availability_domains() {

            echo ""
            echo "Fetching availability domains..."

            AD_TEMP=$(mktemp)

            oci iam availability-domain list \
              --compartment-id "$COMPARTMENT" \
              --query "data[].name" \
              --output json \
              > "$AD_TEMP" 2>&1

            OCI_STATUS=$?

            if [ $OCI_STATUS -ne 0 ]; then

              echo ""
              echo "WARNING: Failed to retrieve availability domains."
              echo "OCI exit code: $OCI_STATUS"
              echo "OCI response:"

              cat "$AD_TEMP"

              rm -f "$AD_TEMP"

              return 1
            fi

            AD_JSON=$(cat "$AD_TEMP")

            rm -f "$AD_TEMP"

            if [ -z "$AD_JSON" ]; then
              echo "WARNING: Availability domain response is empty."
              return 1
            fi

            if ! echo "$AD_JSON" | jq empty >/dev/null 2>&1; then
              echo "WARNING: Availability domain response is invalid JSON."
              echo "$AD_JSON"
              return 1
            fi

            AD_COUNT=$(echo "$AD_JSON" | jq 'length')

            if [ "$AD_COUNT" -eq 0 ]; then
              echo "WARNING: No availability domains found."
              return 1
            fi

            echo "Found $AD_COUNT availability domain(s):"

            echo "$AD_JSON" | jq -r '.[]'

            return 0
          }


          # ==========================================================
          # TRY INSTANCE CREATION
          # ==========================================================

          try_create_instance() {

            local AD="$1"

            echo ""
            echo "------------------------------------------------------"
            echo "Attempting VM creation"
            echo "Availability Domain: $AD"
            echo "------------------------------------------------------"

            LAUNCH_OUTPUT=$(mktemp)

            oci compute instance launch \
              --availability-domain "$AD" \
              --compartment-id "$COMPARTMENT" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":1,"memoryInGBs":2}' \
              --subnet-id "$SUBNET" \
              --image-id "$IMAGE" \
              --assign-public-ip true \
              --display-name "AlwaysFree-ARM-Server" \
              --ssh-authorized-keys-file instance_key.pub \
              > "$LAUNCH_OUTPUT" 2>&1

            OCI_STATUS=$?

            if [ $OCI_STATUS -eq 0 ]; then

              echo ""
              echo "======================================================"
              echo "SUCCESS!"
              echo "======================================================"
              echo "OCI accepted the VM creation request."
              echo "Availability Domain: $AD"
              echo ""
              echo "OCI response:"
              cat "$LAUNCH_OUTPUT"
              echo "======================================================"

              rm -f "$LAUNCH_OUTPUT"

              send_telegram \
                "🎉 SUCCESS! Oracle Always Free VM request was accepted in ${AD}! The VM is now provisioning. 🚀"

              return 0
            fi


            echo ""
            echo "VM creation failed in $AD."
            echo "OCI exit code: $OCI_STATUS"
            echo ""
            echo "OCI response:"
            cat "$LAUNCH_OUTPUT"
            echo ""

            rm -f "$LAUNCH_OUTPUT"

            return 1
          }


          # ==========================================================
          # MAIN LOOP
          # ==========================================================

          CHECK_NUMBER=0

          while true; do

            CHECK_NUMBER=$((CHECK_NUMBER + 1))

            echo ""
            echo ""
            echo "======================================================"
            echo "CHECK #${CHECK_NUMBER}"
            echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "======================================================"


            # --------------------------------------------------------
            # CHECK EXISTING VM
            # --------------------------------------------------------

            check_existing_instance

            EXISTING_STATUS=$?


            # ========================================================
            # VM ALREADY EXISTS
            # ========================================================

            if [ $EXISTING_STATUS -eq 0 ]; then

              echo ""
              echo "======================================================"
              echo "A1 INSTANCE ALREADY EXISTS"
              echo "======================================================"
              echo "Provisioner finished."

              exit 0
            fi


            # ========================================================
            # OCI QUERY FAILED
            # ========================================================

            if [ $EXISTING_STATUS -eq 2 ]; then

              echo ""
              echo "OCI instance query failed."
              echo "This is NOT treated as a fatal workflow error."
              echo "Retrying in ${CHECK_INTERVAL} seconds."

              sleep "$CHECK_INTERVAL"

              continue
            fi


            # ========================================================
            # NO INSTANCE EXISTS
            # ========================================================

            echo ""
            echo "No existing A1 instance found."
            echo "Searching availability domains..."


            # --------------------------------------------------------
            # GET AVAILABILITY DOMAINS
            # --------------------------------------------------------

            if ! get_availability_domains; then

              echo ""
              echo "Could not retrieve availability domains."
              echo "Retrying in ${CHECK_INTERVAL} seconds."

              sleep "$CHECK_INTERVAL"

              continue
            fi


            SUCCESS=false


            # --------------------------------------------------------
            # TRY EVERY AVAILABILITY DOMAIN
            # --------------------------------------------------------

            while IFS= read -r AD; do

              AD=$(echo "$AD" | xargs)

              if [ -z "$AD" ]; then
                continue
              fi

              if try_create_instance "$AD"; then

                SUCCESS=true

                break

              fi

            done < <(echo "$AD_JSON" | jq -r '.[]')


            # ========================================================
            # SUCCESS
            # ========================================================

            if [ "$SUCCESS" = true ]; then

              echo ""
              echo "======================================================"
              echo "VM CREATION REQUEST ACCEPTED"
              echo "======================================================"
              echo "Stopping provisioner."

              exit 0
            fi


            # ========================================================
            # NOTHING AVAILABLE
            # ========================================================

            echo ""
            echo "======================================================"
            echo "NO A1 CAPACITY FOUND"
            echo "======================================================"
            echo "All availability domains were attempted."
            echo "Next check in ${CHECK_INTERVAL} seconds."
            echo "======================================================"


            # --------------------------------------------------------
            # EXACT 60 SECOND WAIT
            # --------------------------------------------------------

            sleep "$CHECK_INTERVAL"

          done
