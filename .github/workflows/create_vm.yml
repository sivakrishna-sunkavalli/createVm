name: Oracle Always Free A1 Provisioner

on:
  schedule:
    # GitHub's scheduler has a 5-minute minimum.
    # The running job performs the actual OCI check every 60 seconds.
    - cron: '*/5 * * * *'

  workflow_dispatch:

# Prevent multiple provisioner jobs from competing with each other.
concurrency:
  group: oracle-a1-provisioner
  cancel-in-progress: false


jobs:

  launch-instance:

    runs-on: ubuntu-latest

    # GitHub-hosted runner maximum depends on plan.
    # Keep this below the normal GitHub-hosted job limit.
    timeout-minutes: 350

    steps:

      # ============================================================
      # INSTALL OCI CLI
      # ============================================================

      - name: Install and configure OCI CLI
        shell: bash

        env:
          OCI_KEY_FILE: ${{ secrets.OCI_KEY_FILE }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}

        run: |
          set -u

          echo "======================================================"
          echo "Installing OCI CLI"
          echo "======================================================"

          mkdir -p "$HOME/.oci"


          # ----------------------------------------------------------
          # Write private key
          # ----------------------------------------------------------

          if [ -z "${OCI_KEY_FILE:-}" ]; then
            echo "ERROR: OCI_KEY_FILE secret is empty."
            exit 1
          fi

          printf '%s\n' "$OCI_KEY_FILE" \
            > "$HOME/.oci/oci_api_key.pem"

          chmod 600 "$HOME/.oci/oci_api_key.pem"


          # ----------------------------------------------------------
          # Write OCI config
          # ----------------------------------------------------------

          if [ -z "${OCI_USER_ID:-}" ]; then
            echo "ERROR: OCI_USER_ID secret is empty."
            exit 1
          fi

          if [ -z "${OCI_FINGERPRINT:-}" ]; then
            echo "ERROR: OCI_FINGERPRINT secret is empty."
            exit 1
          fi

          if [ -z "${OCI_TENANCY_ID:-}" ]; then
            echo "ERROR: OCI_TENANCY_ID secret is empty."
            exit 1
          fi


          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=${OCI_USER_ID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_ID}
          region=us-chicago-1
          key_file=${HOME}/.oci/oci_api_key.pem
          EOF

          chmod 600 "$HOME/.oci/config"


          # ----------------------------------------------------------
          # Install OCI CLI
          # ----------------------------------------------------------

          echo "Installing OCI CLI..."

          python -m pip install --upgrade pip

          python -m pip install --upgrade oci-cli


          # ----------------------------------------------------------
          # Verify installation
          # ----------------------------------------------------------

          echo ""
          echo "OCI CLI version:"

          oci --version


          echo ""
          echo "OCI configuration created successfully."


      # ============================================================
      # PROVISIONER
      # ============================================================

      - name: Check OCI capacity every minute
        shell: bash

        env:

          # OCI configuration
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"

          # OCI resources
          COMPARTMENT: ${{ vars.OCI_COMPARTMENT_ID }}
          SUBNET: ${{ vars.OCI_SUBNET_ID }}
          IMAGE: ${{ vars.OCI_IMAGE_ID }}

          # SSH
          SSH_KEY: ${{ vars.SSH_PUBLIC_KEY }}

          # Telegram
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          # ==========================================================
          # IMPORTANT
          # ==========================================================
          #
          # Do NOT enable "set -e".
          #
          # OCI launch failures are expected when A1 capacity is
          # unavailable. Every command is therefore handled manually.
          #

          set -u


          # ==========================================================
          # CONFIGURATION
          # ==========================================================

          CHECK_INTERVAL=60

          REGION="us-chicago-1"

          echo ""
          echo "======================================================"
          echo "Oracle Always Free A1 Provisioner"
          echo "======================================================"
          echo "Check interval: ${CHECK_INTERVAL} seconds"
          echo "Region: ${REGION}"
          echo "======================================================"


          # ==========================================================
          # VALIDATE ENVIRONMENT
          # ==========================================================

          echo ""
          echo "Validating configuration..."


          if [ -z "${COMPARTMENT:-}" ]; then
            echo "ERROR: OCI_COMPARTMENT_ID is empty."
            exit 1
          fi


          if [ -z "${SUBNET:-}" ]; then
            echo "ERROR: OCI_SUBNET_ID is empty."
            exit 1
          fi


          if [ -z "${IMAGE:-}" ]; then
            echo "ERROR: OCI_IMAGE_ID is empty."
            exit 1
          fi


          if [ -z "${SSH_KEY:-}" ]; then
            echo "ERROR: SSH_PUBLIC_KEY is empty."
            exit 1
          fi


          echo "Configuration validation passed."


          # ==========================================================
          # CREATE SSH PUBLIC KEY
          # ==========================================================

          echo ""
          echo "Creating SSH public key file..."


          printf '%s\n' "$SSH_KEY" > instance_key.pub

          chmod 600 instance_key.pub


          if [ ! -s instance_key.pub ]; then
            echo "ERROR: SSH public key file is empty."
            exit 1
          fi


          echo "SSH public key created."


          # ==========================================================
          # TELEGRAM FUNCTION
          # ==========================================================

          send_telegram() {

            local MESSAGE="$1"


            if [ -z "${TG_TOKEN:-}" ]; then
              echo "Telegram token not configured."
              return 0
            fi


            if [ -z "${TG_CHAT:-}" ]; then
              echo "Telegram chat ID not configured."
              return 0
            fi


            echo "Sending Telegram notification..."


            curl \
              --silent \
              --show-error \
              --fail \
              --max-time 20 \
              --retry 2 \
              -X POST \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${MESSAGE}" \
              >/dev/null


            CURL_STATUS=$?


            if [ "$CURL_STATUS" -ne 0 ]; then
              echo "WARNING: Telegram notification failed."
            else
              echo "Telegram notification sent."
            fi


            return 0
          }


          # ==========================================================
          # OCI AUTHENTICATION TEST
          # ==========================================================

          echo ""
          echo "Testing OCI authentication..."


          AUTH_OUTPUT=$(mktemp)


          oci iam region list \
            --output json \
            > "$AUTH_OUTPUT" 2>&1


          AUTH_STATUS=$?


          if [ "$AUTH_STATUS" -ne 0 ]; then

            echo ""
            echo "WARNING: OCI authentication test failed."
            echo "OCI exit code: $AUTH_STATUS"
            echo ""
            echo "OCI response:"
            cat "$AUTH_OUTPUT"

            rm -f "$AUTH_OUTPUT"

            echo ""
            echo "The provisioner will continue."
            echo "The next loop will retry."

          else

            echo "OCI authentication test passed."

            rm -f "$AUTH_OUTPUT"

          fi


          # ==========================================================
          # CHECK EXISTING A1 INSTANCE
          # ==========================================================

          check_existing_instance() {

            echo ""
            echo "Checking for existing Ampere A1 instances..."


            OUTPUT_FILE=$(mktemp)


            # IMPORTANT:
            #
            # stdout contains JSON.
            # stderr contains diagnostics.
            #
            # The security warning from OCI CLI can appear in output
            # depending on CLI version, so we filter the result before
            # giving it to jq.

            oci compute instance list \
              --compartment-id "$COMPARTMENT" \
              --all \
              --output json \
              > "$OUTPUT_FILE" 2>&1


            OCI_STATUS=$?


            if [ "$OCI_STATUS" -ne 0 ]; then

              echo ""
              echo "WARNING: OCI instance list failed."
              echo "OCI exit code: $OCI_STATUS"
              echo ""
              echo "OCI response:"
              cat "$OUTPUT_FILE"

              rm -f "$OUTPUT_FILE"

              return 2

            fi


            # --------------------------------------------------------
            # Extract JSON from the OCI response.
            #
            # OCI warnings may be printed before the JSON.
            # Find the first line beginning with { and parse from there.
            # --------------------------------------------------------

            JSON_FILE=$(mktemp)


            awk '
              BEGIN { found=0 }
              /^[[:space:]]*\{/ {
                found=1
              }
              found {
                print
              }
            ' "$OUTPUT_FILE" > "$JSON_FILE"


            rm -f "$OUTPUT_FILE"


            if [ ! -s "$JSON_FILE" ]; then

              echo ""
              echo "WARNING: OCI returned no JSON data."

              echo "Raw OCI output was:"
              cat "$JSON_FILE"

              rm -f "$JSON_FILE"

              return 2

            fi


            # --------------------------------------------------------
            # Validate JSON
            # --------------------------------------------------------

            if ! jq empty "$JSON_FILE" >/dev/null 2>&1; then

              echo ""
              echo "WARNING: OCI returned invalid JSON."

              echo "Response:"
              cat "$JSON_FILE"

              rm -f "$JSON_FILE"

              return 2

            fi


            # --------------------------------------------------------
            # Filter A1 instances
            # --------------------------------------------------------

            EXISTING_VMS=$(jq -c '
              [
                .data[]
                | select(
                    .shape == "VM.Standard.A1.Flex"
                    and .["lifecycle-state"] != "TERMINATED"
                  )
                | .id
              ]
            ' "$JSON_FILE" 2>/dev/null)


            JQ_STATUS=$?


            rm -f "$JSON_FILE"


            if [ "$JQ_STATUS" -ne 0 ]; then

              echo "WARNING: Could not process OCI instance data."

              return 2

            fi


            echo "Existing A1 instances: ${EXISTING_VMS}"


            INSTANCE_COUNT=$(echo "$EXISTING_VMS" | jq 'length' 2>/dev/null)


            if [ -z "$INSTANCE_COUNT" ]; then

              echo "WARNING: Could not determine instance count."

              return 2

            fi


            if [ "$INSTANCE_COUNT" -gt 0 ]; then

              echo ""
              echo "A1 instance already exists."

              return 0

            fi


            echo "No A1 instance currently exists."

            return 1
          }


          # ==========================================================
          # GET AVAILABILITY DOMAINS
          # ==========================================================

          get_availability_domains() {

            echo ""
            echo "Fetching availability domains..."


            OUTPUT_FILE=$(mktemp)


            oci iam availability-domain list \
              --compartment-id "$COMPARTMENT" \
              --output json \
              > "$OUTPUT_FILE" 2>&1


            OCI_STATUS=$?


            if [ "$OCI_STATUS" -ne 0 ]; then

              echo ""
              echo "WARNING: Availability-domain request failed."
              echo "OCI exit code: $OCI_STATUS"
              echo ""
              echo "OCI response:"
              cat "$OUTPUT_FILE"

              rm -f "$OUTPUT_FILE"

              return 1

            fi


            # Extract JSON, ignoring any OCI warning text.
            awk '
              BEGIN { found=0 }
              /^[[:space:]]*\{/ {
                found=1
              }
              found {
                print
              }
            ' "$OUTPUT_FILE" > "${OUTPUT_FILE}.json"


            rm -f "$OUTPUT_FILE"


            if [ ! -s "${OUTPUT_FILE}.json" ]; then

              echo "WARNING: No availability-domain JSON returned."

              rm -f "${OUTPUT_FILE}.json"

              return 1

            fi


            if ! jq empty "${OUTPUT_FILE}.json" >/dev/null 2>&1; then

              echo "WARNING: Availability-domain JSON is invalid."

              cat "${OUTPUT_FILE}.json"

              rm -f "${OUTPUT_FILE}.json"

              return 1

            fi


            AD_JSON=$(jq -c '.data | map(.name)' "${OUTPUT_FILE}.json" 2>/dev/null)


            JQ_STATUS=$?


            rm -f "${OUTPUT_FILE}.json"


            if [ "$JQ_STATUS" -ne 0 ] || [ -z "$AD_JSON" ]; then

              echo "WARNING: Could not parse availability domains."

              return 1

            fi


            AD_COUNT=$(echo "$AD_JSON" | jq 'length')


            if [ "$AD_COUNT" -eq 0 ]; then

              echo "WARNING: No availability domains found."

              return 1

            fi


            echo ""
            echo "Found ${AD_COUNT} availability domain(s):"

            echo "$AD_JSON" | jq -r '.[]'


            return 0
          }


          # ==========================================================
          # ATTEMPT INSTANCE CREATION
          # ==========================================================

          try_create_instance() {

            local AD="$1"


            echo ""
            echo "------------------------------------------------------"
            echo "Attempting VM creation"
            echo "Availability Domain: ${AD}"
            echo "------------------------------------------------------"


            OUTPUT_FILE=$(mktemp)


            oci compute instance launch \
              --availability-domain "$AD" \
              --compartment-id "$COMPARTMENT" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":1,"memoryInGBs":2}' \
              --subnet-id "$SUBNET" \
              --image-id "$IMAGE" \
              --assign-public-ip true \
              --display-name "AlwaysFree-ARM-Server" \
              --ssh-authorized-keys-file instance_key.pub \
              --output json \
              > "$OUTPUT_FILE" 2>&1


            OCI_STATUS=$?


            if [ "$OCI_STATUS" -eq 0 ]; then

              echo ""
              echo "======================================================"
              echo "SUCCESS!"
              echo "======================================================"
              echo "OCI accepted the VM creation request."
              echo "Availability Domain: ${AD}"
              echo ""
              echo "OCI response:"
              cat "$OUTPUT_FILE"
              echo "======================================================"


              rm -f "$OUTPUT_FILE"


              send_telegram \
                "🎉 SUCCESS! Oracle Always Free VM request was accepted in ${AD}! The VM is now provisioning. 🚀"


              return 0

            fi


            echo ""
            echo "VM creation was not accepted in ${AD}."
            echo "OCI exit code: ${OCI_STATUS}"
            echo ""
            echo "OCI response:"
            cat "$OUTPUT_FILE"


            rm -f "$OUTPUT_FILE"


            return 1
          }


          # ==========================================================
          # MAIN LOOP
          # ==========================================================

          CHECK_NUMBER=0


          while true; do

            CHECK_NUMBER=$((CHECK_NUMBER + 1))


            echo ""
            echo ""
            echo "======================================================"
            echo "CHECK #${CHECK_NUMBER}"
            echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "======================================================"


            # ========================================================
            # CHECK FOR EXISTING INSTANCE
            # ========================================================

            check_existing_instance

            EXISTING_STATUS=$?


            # --------------------------------------------------------
            # A1 INSTANCE FOUND
            # --------------------------------------------------------

            if [ "$EXISTING_STATUS" -eq 0 ]; then

              echo ""
              echo "======================================================"
              echo "A1 INSTANCE ALREADY EXISTS"
              echo "======================================================"
              echo "Stopping provisioner."

              exit 0

            fi


            # --------------------------------------------------------
            # OCI QUERY ERROR
            # --------------------------------------------------------

            if [ "$EXISTING_STATUS" -eq 2 ]; then

              echo ""
              echo "OCI query failed."
              echo "This is treated as a temporary error."
              echo "Retrying in ${CHECK_INTERVAL} seconds."

              sleep "$CHECK_INTERVAL"

              continue

            fi


            # ========================================================
            # GET AVAILABILITY DOMAINS
            # ========================================================

            get_availability_domains

            AD_STATUS=$?


            if [ "$AD_STATUS" -ne 0 ]; then

              echo ""
              echo "Could not retrieve availability domains."
              echo "Retrying in ${CHECK_INTERVAL} seconds."

              sleep "$CHECK_INTERVAL"

              continue

            fi


            SUCCESS=false


            # ========================================================
            # TRY EACH AVAILABILITY DOMAIN
            # ========================================================

            while IFS= read -r AD; do

              AD=$(echo "$AD" | xargs)


              if [ -z "$AD" ]; then
                continue
              fi


              if try_create_instance "$AD"; then

                SUCCESS=true

                break

              fi


              echo ""
              echo "Trying next availability domain..."

            done < <(echo "$AD_JSON" | jq -r '.[]')


            # ========================================================
            # SUCCESS
            # ========================================================

            if [ "$SUCCESS" = true ]; then

              echo ""
              echo "======================================================"
              echo "VM CREATION REQUEST ACCEPTED"
              echo "======================================================"
              echo "Provisioner completed successfully."

              exit 0

            fi


            # ========================================================
            # NO CAPACITY
            # ========================================================

            echo ""
            echo "======================================================"
            echo "NO A1 CAPACITY FOUND"
            echo "======================================================"
            echo "All availability domains were attempted."
            echo ""
            echo "Next check in ${CHECK_INTERVAL} seconds."
            echo "======================================================"


            # ========================================================
            # WAIT 60 SECONDS
            # ========================================================

            sleep "$CHECK_INTERVAL"

          done
