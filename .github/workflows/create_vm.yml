name: Oracle Always Free A1 Provisioner

on:
 # schedule:
#    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: oracle-a1-provisioner
  cancel-in-progress: true

jobs:
  launch-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install OCI CLI
        shell: bash
        env:
          OCI_KEY_FILE: ${{ secrets.OCI_KEY_FILE }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
        run: |
          set +e
          set +H

          mkdir -p "$HOME/.oci"

          if [ -z "${OCI_KEY_FILE:-}" ] || [ -z "${OCI_USER_ID:-}" ] || [ -z "${OCI_FINGERPRINT:-}" ] || [ -z "${OCI_TENANCY_ID:-}" ]; then
            echo "ERROR: one or more OCI secrets are empty."
            exit 1
          fi

          # Support both real newlines and literal \n in the secret
          printf '%s\n' "$OCI_KEY_FILE" | sed 's/\\n/\n/g' > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=${OCI_USER_ID}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY_ID}
          region=us-chicago-1
          key_file=${HOME}/.oci/oci_api_key.pem
          EOF
          chmod 600 "$HOME/.oci/config"

          python3 -m pip install --user --upgrade pip oci-cli

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          oci --version

          if ! oci iam region list --output json >/dev/null; then
            echo "OCI AUTHENTICATION FAILED"
            oci iam region list --output json
            exit 1
          fi

          echo "OCI authentication successful."

      - name: Check OCI capacity every minute
        shell: bash
        env:
          SUPPRESS_LABEL_WARNING: "True"
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          COMPARTMENT: ${{ vars.OCI_COMPARTMENT_ID }}
          SUBNET: ${{ vars.OCI_SUBNET_ID }}
          IMAGE: ${{ vars.OCI_IMAGE_ID }}
          SSH_KEY: ${{ vars.SSH_PUBLIC_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          set +H
          set +o pipefail
          export PATH="$HOME/.local/bin:$PATH"

          CHECK_INTERVAL=60

          echo "======================================================"
          echo "Oracle Always Free A1 Provisioner"
          echo "Check interval: ${CHECK_INTERVAL} seconds"
          echo "Region: us-chicago-1"
          echo "======================================================"

          if ! command -v oci >/dev/null 2>&1; then
            echo "oci not on PATH; installing..."
            python3 -m pip install --user --upgrade oci-cli
            export PATH="$HOME/.local/bin:$PATH"
          fi

          if [ -z "${COMPARTMENT:-}" ] || [ -z "${SUBNET:-}" ] || [ -z "${IMAGE:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "ERROR: missing OCI_COMPARTMENT_ID, OCI_SUBNET_ID, OCI_IMAGE_ID, or SSH_PUBLIC_KEY."
            exit 1
          fi

          printf '%s\n' "$SSH_KEY" > instance_key.pub
          chmod 644 instance_key.pub

          send_telegram() {
            local MESSAGE="$1"
            [ -z "${TG_TOKEN:-}" ] && return 0
            [ -z "${TG_CHAT:-}" ] && return 0
            curl --silent --show-error --fail --max-time 20 --retry 2 \
              -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${MESSAGE}" \
              >/dev/null 2>&1 || true
          }

          # Prints count to stdout. Never exits the job.
          #  0 = none, >0 = already exists, 255 = query error
          count_existing_a1() {
            local OUT ERR CODE COUNT
            OUT=$(mktemp)
            ERR=$(mktemp)

            oci compute instance list \
              --compartment-id "$COMPARTMENT" \
              --all \
              --output json \
              >"$OUT" 2>"$ERR"
            CODE=$?

            if [ "$CODE" -ne 0 ]; then
              echo "OCI instance list failed (exit $CODE)" >&2
              cat "$ERR" >&2
              rm -f "$OUT" "$ERR"
              echo 255
              return 0
            fi

            if [ ! -s "$OUT" ] || ! jq empty "$OUT" >/dev/null 2>&1; then
              echo "WARNING: empty/invalid instance-list JSON; treating as zero instances" >&2
              cat "$OUT" >&2
              cat "$ERR" >&2
              rm -f "$OUT" "$ERR"
              echo 0
              return 0
            fi

            COUNT=$(jq '[.data[]? | select(.shape == "VM.Standard.A1.Flex" and ."lifecycle-state" != "TERMINATED" and ."lifecycle-state" != "TERMINATING")] | length' "$OUT")
            rm -f "$OUT" "$ERR"
            echo "${COUNT:-0}"
            return 0
          }

          list_ads() {
            local OUT ERR CODE
            OUT=$(mktemp)
            ERR=$(mktemp)

            oci iam availability-domain list \
              --compartment-id "$COMPARTMENT" \
              --output json \
              >"$OUT" 2>"$ERR"
            CODE=$?

            if [ "$CODE" -ne 0 ] || [ ! -s "$OUT" ] || ! jq empty "$OUT" >/dev/null 2>&1; then
              echo "Availability-domain query failed (exit $CODE)" >&2
              cat "$OUT" >&2
              cat "$ERR" >&2
              rm -f "$OUT" "$ERR"
              echo "[]"
              return 0
            fi

            jq -c '.data | map(.name)' "$OUT"
            rm -f "$OUT" "$ERR"
            return 0
          }

          try_create_instance() {
            local AD="$1" OUT ERR CODE
            OUT=$(mktemp)
            ERR=$(mktemp)

            echo "Attempting VM creation in ${AD}..."

            oci compute instance launch \
              --availability-domain "$AD" \
              --compartment-id "$COMPARTMENT" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":1,"memoryInGBs":2}' \
              --subnet-id "$SUBNET" \
              --image-id "$IMAGE" \
              --assign-public-ip true \
              --display-name "AlwaysFree-ARM-Server" \
              --ssh-authorized-keys-file instance_key.pub \
              --output json \
              >"$OUT" 2>"$ERR"
            CODE=$?

            if [ "$CODE" -eq 0 ]; then
              echo "======================================================"
              echo "SUCCESS — create request accepted in ${AD}"
              echo "======================================================"
              cat "$OUT"
              rm -f "$OUT" "$ERR"
              send_telegram "SUCCESS: Oracle Always Free VM request accepted in ${AD}."
              return 0
            fi

            echo "VM creation failed in ${AD} (exit ${CODE})"
            cat "$OUT"
            cat "$ERR"
            rm -f "$OUT" "$ERR"
            return 1
          }

          CHECK_NUMBER=0
          while true; do
            CHECK_NUMBER=$((CHECK_NUMBER + 1))
            echo ""
            echo "======================================================"
            echo "CHECK #${CHECK_NUMBER}  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "======================================================"

            INSTANCE_COUNT=$(count_existing_a1)
            echo "Existing non-terminated A1 instances: ${INSTANCE_COUNT}"

            if [ "$INSTANCE_COUNT" = "255" ]; then
              echo "OCI query failed. Retrying in ${CHECK_INTERVAL}s..."
              sleep "$CHECK_INTERVAL"
              continue
            fi

            if [ "$INSTANCE_COUNT" -gt 0 ]; then
              echo "A1 INSTANCE ALREADY EXISTS"
              exit 0
            fi

            AD_JSON=$(list_ads)
            AD_COUNT=$(echo "$AD_JSON" | jq 'length')

            if [ "${AD_COUNT:-0}" -eq 0 ]; then
              echo "Could not retrieve availability domains. Retrying in ${CHECK_INTERVAL}s..."
              sleep "$CHECK_INTERVAL"
              continue
            fi

            echo "Availability domains:"
            echo "$AD_JSON" | jq -r '.[]'

            SUCCESS=false
            while IFS= read -r AD; do
              AD=$(echo "$AD" | xargs)
              [ -z "$AD" ] && continue
              if try_create_instance "$AD"; then
                SUCCESS=true
                break
              fi
            done < <(echo "$AD_JSON" | jq -r '.[]')

            if [ "$SUCCESS" = true ]; then
              exit 0
            fi

            echo "NO A1 CAPACITY FOUND. Next check in ${CHECK_INTERVAL}s."
            sleep "$CHECK_INTERVAL"
          done
